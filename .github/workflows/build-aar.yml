name: Build Iceraven Android AAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Install Android SDK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64

      - name: Install NDK
        uses: actions/setup-android@v3
        with:
          api-level: 33

      - name: Install gomobile
        run: go install golang.org/x/mobile/cmd/gomobile@latest

      - name: Init gomobile
        run: gomobile init

      - name: Build AAR
        run: |
          cd /root/work/iceraven-check
          # 这里假设已经有了本地的 Go 模块（ech-proxy-go 的集成代码）
          # 实际构建时需要把 Go 代码编译成 so 并放入 appropriate positions
          # 示例命令（根据实际目录结构调整）：
          # gomobile bind -target android/arm64 -o app/src/main/jniLibs/arm64-v8a/libechdoh.so ./mobile/echdoh/
          echo "Build step configured - adjust paths for your project"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: iceraven-aar
          path: |
            **/*.aar
            **/*.so